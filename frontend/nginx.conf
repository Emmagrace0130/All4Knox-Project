# Serves the built SPA and reverse-proxies the API under the SAME origin.
#
# Why same-origin: api.all4knox.axiomsystemslab.com does not exist in DNS, and
# adding a second hostname would mean a second Let's Encrypt cert for no gain.
# Proxying /api here means one DNS record, one certificate, and no CORS
# preflight on any clinical request.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The assistant streams tokens over SSE. Without these the answer
        # appears all at once at the end, which reads as a hang during a demo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # --- SPA ---------------------------------------------------------------
    # React Router owns the routes, so unknown paths must return index.html
    # rather than a 404 — otherwise deep links like /toolkit/uds break on
    # refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or users
    # keep a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
